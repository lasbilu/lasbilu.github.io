<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#12051f" />
  <meta name="description" content="Lasbilu – Twitch, Instagram, TikTok, Discord und mehr." />

  <title>Lasbilu | Links</title>

  <link rel="preconnect" href="https://cdnjs.cloudflare.com" />
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main class="page">

    <header class="hero">
      <div class="hero-image"></div>
      <div class="hero-fade"></div>

      <div class="profile">
        <img src="assets/profile.png" alt="Lasbilu Profilbild" class="profile-image" />

        <h1>Lasbilu</h1>
        <p class="tagline">Gamer · Streamer · Socials</p>
        <p class="intro">Gaming, Content, Community und ein bisschen Chaos.</p>

        <nav class="quick-socials" aria-label="Social Media Schnelllinks">
          <a href="https://www.twitch.com/lasbilu"
             target="_blank" rel="noopener noreferrer"
             aria-label="Twitch"
             data-track="twitch" data-track-source="quick">
            <i class="fa-brands fa-twitch"></i>
          </a>

          <a href="https://www.instagram.com/lasbiluvo"
             target="_blank" rel="noopener noreferrer"
             aria-label="Instagram"
             data-track="instagram" data-track-source="quick">
            <i class="fa-brands fa-instagram"></i>
          </a>

          <a href="https://www.tiktok.com/@lasbiluvo"
             target="_blank" rel="noopener noreferrer"
             aria-label="TikTok"
             data-track="tiktok" data-track-source="quick">
            <i class="fa-brands fa-tiktok"></i>
          </a>

          <a href="https://discord.gg/s4KQPat4Bq"
             target="_blank" rel="noopener noreferrer"
             aria-label="Discord"
             data-track="discord" data-track-source="quick">
            <i class="fa-brands fa-discord"></i>
          </a>

          <a href="https://tinder.com/@lasbilu"
             target="_blank" rel="noopener noreferrer"
             aria-label="Tinder"
             data-track="tinder" data-track-source="quick">
            <i class="fa-solid fa-fire"></i>
          </a>
        </nav>
      </div>
    </header>

    <section class="links" aria-label="Links">

      <a class="link-card"
         href="https://www.twitch.com/lasbilu"
         target="_blank" rel="noopener noreferrer"
         data-track="twitch" data-track-source="card">
        <span class="platform-icon twitch"><i class="fa-brands fa-twitch"></i></span>
        <span class="link-text">
          <strong>Twitch</strong>
          <small>Live Streams & Gaming</small>
        </span>
        <span class="chevron"><i class="fa-solid fa-chevron-right"></i></span>
      </a>

      <a class="link-card"
         href="https://www.instagram.com/lasbiluvo"
         target="_blank" rel="noopener noreferrer"
         data-track="instagram" data-track-source="card">
        <span class="platform-icon instagram"><i class="fa-brands fa-instagram"></i></span>
        <span class="link-text">
          <strong>Instagram</strong>
          <small>Fotos & Updates</small>
        </span>
        <span class="chevron"><i class="fa-solid fa-chevron-right"></i></span>
      </a>

      <a class="link-card"
         href="https://www.tiktok.com/@lasbiluvo"
         target="_blank" rel="noopener noreferrer"
         data-track="tiktok" data-track-source="card">
        <span class="platform-icon tiktok"><i class="fa-brands fa-tiktok"></i></span>
        <span class="link-text">
          <strong>TikTok</strong>
          <small>Short Videos & Clips</small>
        </span>
        <span class="chevron"><i class="fa-solid fa-chevron-right"></i></span>
      </a>

      <a class="link-card"
         href="https://discord.gg/s4KQPat4Bq"
         target="_blank" rel="noopener noreferrer"
         data-track="discord" data-track-source="card">
        <span class="platform-icon discord"><i class="fa-brands fa-discord"></i></span>
        <span class="link-text">
          <strong>Discord Server</strong>
          <small>Community beitreten</small>
        </span>
        <span class="chevron"><i class="fa-solid fa-chevron-right"></i></span>
      </a>

      <a class="link-card"
         href="https://tinder.com/@lasbilu"
         target="_blank" rel="noopener noreferrer"
         data-track="tinder" data-track-source="card">
        <span class="platform-icon tinder"><i class="fa-solid fa-fire"></i></span>
        <span class="link-text">
          <strong>Tinder</strong>
          <small>Mein Profil</small>
        </span>
        <span class="chevron"><i class="fa-solid fa-chevron-right"></i></span>
      </a>

    </section>

    <footer>
      <span>© <span id="year"></span> Lasbilu</span>
    </footer>
  </main>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
  <script src="tracker.js"></script>
</body>
</html>
